<!doctype html>
<html lang="en" data-paper-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper Todo</title>
    <style>
      :root,
html[data-paper-theme='light'] {
  --desk-bg: #f2ede3;
  --paper-bg: #fbf8f1;
  --paper-elevated: #f5f0e5;
  --paper-hover: rgba(94, 79, 58, 0.045);
  --paper-flash: rgba(182, 70, 54, 0.10);
  --paper-border: rgba(74, 62, 47, 0.14);
  --rule-line: rgba(74, 62, 47, 0.10);
  --rule-strong: rgba(74, 62, 47, 0.20);
  --margin-line: rgba(194, 122, 102, 0.25);

  --ink-primary: #2a2520;
  --ink-secondary: #6f675d;
  --ink-muted: #9f9689;
  --ink-faint: #c4bbb0;

  --accent: #b64636;
  --accent-soft: rgba(182, 70, 54, 0.10);
  --waiting: #8c6835;
  --waiting-soft: rgba(140, 104, 53, 0.11);
  --inbox: #4c6b7a;
  --inbox-soft: rgba(76, 107, 122, 0.11);

  --shadow-sheet:
    0 1px 2px rgba(42, 35, 26, 0.05),
    0 10px 28px rgba(42, 35, 26, 0.045);
  --grain-opacity: 0.032;
}

html[data-paper-theme='dark'] {
  --desk-bg: #171513;
  --paper-bg: #201e1b;
  --paper-elevated: #282521;
  --paper-hover: rgba(242, 232, 214, 0.045);
  --paper-flash: rgba(217, 114, 96, 0.14);
  --paper-border: rgba(235, 224, 206, 0.12);
  --rule-line: rgba(235, 224, 206, 0.09);
  --rule-strong: rgba(235, 224, 206, 0.20);
  --margin-line: rgba(212, 130, 112, 0.20);

  --ink-primary: #eae3d8;
  --ink-secondary: #a69d90;
  --ink-muted: #766e63;
  --ink-faint: #4d473f;

  --accent: #de7562;
  --accent-soft: rgba(222, 117, 98, 0.14);
  --waiting: #cca266;
  --waiting-soft: rgba(204, 162, 102, 0.14);
  --inbox: #7ba6ba;
  --inbox-soft: rgba(123, 166, 186, 0.14);

  --shadow-sheet:
    0 1px 3px rgba(0, 0, 0, 0.30),
    0 12px 32px rgba(0, 0, 0, 0.25);
  --grain-opacity: 0.04;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--desk-bg);
  color: var(--ink-primary);
  font-family:
    -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
    'Microsoft YaHei UI', 'Segoe UI', sans-serif;
  font-size: 13.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.desk {
  padding: 14px 12px 24px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.sheet {
  position: relative;
  width: 100%;
  max-width: 720px;
  min-height: 400px;
  background: var(--paper-bg);
  border: 1px solid var(--paper-border);
  border-radius: 6px;
  box-shadow: var(--shadow-sheet);
  padding: 22px 24px 20px 44px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Subtle cotton-paper fiber grain (pure data URI, CSP-safe) */
.sheet::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: var(--grain-opacity);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 180px 180px;
}

/* Classic stationery vertical margin line */
.margin-rule {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 30px;
  width: 1px;
  background: var(--margin-line);
  pointer-events: none;
}

.masthead,
.filter-bar,
.composer,
.list-area,
.sheet-footer {
  position: relative;
  z-index: 1;
}

/* Masthead */
.masthead {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--rule-strong);
}

.date-stamp {
  font-family: ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--ink-muted);
  margin-bottom: 2px;
}

.sheet-title {
  margin: 0;
  font-family: 'Iowan Old Style', 'Palatino Linotype', 'Songti SC', 'Noto Serif SC', Georgia, serif;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink-primary);
  line-height: 1.2;
}

.masthead-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sync-indicator {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  font-size: 11px;
  color: var(--ink-muted);
  user-select: none;
}

.sync-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink-faint);
  transition: background 0.25s ease, transform 0.25s ease;
}

.sync-indicator.is-live .sync-dot {
  background: #6b8f71;
}

.sync-indicator.is-syncing .sync-dot {
  background: var(--accent);
  transform: scale(1.25);
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: 1px solid transparent;
  border-radius: 4px;
  background: transparent;
  color: var(--ink-secondary);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.icon-btn:hover {
  background: var(--paper-hover);
  color: var(--ink-primary);
  border-color: var(--rule-line);
}

/* Filter Tabs */
.filter-bar {
  padding-top: 10px;
  border-bottom: 1px solid var(--rule-line);
}

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}

.tab {
  position: relative;
  border: none;
  background: transparent;
  padding: 4px 0 9px;
  font-family: inherit;
  font-size: 12.5px;
  color: var(--ink-secondary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: color 0.15s ease;
}

.tab:hover {
  color: var(--ink-primary);
}

.tab.is-active {
  color: var(--ink-primary);
  font-weight: 600;
}

.tab.is-active::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 1.5px;
  background: var(--ink-primary);
}

.tab-count {
  font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  font-size: 11px;
  color: var(--ink-muted);
}

.tab[data-tab='inbox'].has-items .tab-count {
  color: var(--accent);
  font-weight: 600;
}

.people-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
  padding: 6px 0 9px;
  border-top: 1px dashed var(--rule-line);
}

.person-chip {
  border: none;
  background: transparent;
  padding: 1px 4px;
  border-radius: 3px;
  font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  font-size: 11.5px;
  color: var(--ink-secondary);
  cursor: pointer;
  transition: color 0.15s ease, background 0.15s ease;
}

.person-chip:hover {
  color: var(--ink-primary);
  background: var(--paper-hover);
}

.person-chip.is-active {
  color: var(--accent);
  background: var(--accent-soft);
  font-weight: 600;
}

/* Composer (Top writing line) */
.composer {
  padding: 12px 0;
  border-bottom: 1px solid var(--rule-line);
}

.composer-main {
  display: flex;
  align-items: center;
  gap: 8px;
}

.composer-glyph {
  width: 18px;
  text-align: center;
  font-size: 16px;
  color: var(--ink-muted);
  user-select: none;
  flex-shrink: 0;
}

.composer-input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: var(--ink-primary);
  font-family: inherit;
  font-size: 13.5px;
  padding: 4px 0;
}

.composer-input::placeholder {
  color: var(--ink-muted);
}

.composer-submit {
  border: 1px solid var(--rule-strong);
  background: transparent;
  color: var(--ink-secondary);
  border-radius: 4px;
  padding: 4px 10px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.composer-submit:hover {
  border-color: var(--ink-primary);
  color: var(--ink-primary);
  background: var(--paper-hover);
}

.composer-extras {
  margin-top: 9px;
  padding-left: 26px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
}

.mini-field {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  color: var(--ink-muted);
}

.mini-field select,
.mini-field input {
  border: none;
  border-bottom: 1px solid var(--rule-strong);
  background: transparent;
  color: var(--ink-primary);
  font-family: inherit;
  font-size: 12px;
  padding: 2px 4px;
  outline: none;
  width: 92px;
}

.mini-field select {
  width: auto;
  cursor: pointer;
}

.mini-field select option {
  background: var(--paper-bg);
  color: var(--ink-primary);
}

.mini-field input:focus,
.mini-field select:focus {
  border-bottom-color: var(--ink-primary);
}

.mini-toggle {
  border: 1px solid var(--rule-strong);
  background: transparent;
  color: var(--ink-secondary);
  border-radius: 3px;
  padding: 2px 7px;
  font-size: 11.5px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.mini-toggle[data-active='true'] {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
  font-weight: 600;
}

/* Task list */
.list-area {
  flex: 1;
  padding: 6px 0 12px;
}

.section-group {
  margin-top: 14px;
}

.section-group:first-child {
  margin-top: 4px;
}

.section-heading {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: 'Iowan Old Style', 'Palatino Linotype', 'Songti SC', 'Noto Serif SC', Georgia, serif;
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--ink-muted);
  padding: 4px 0 6px;
  border-bottom: 1px solid var(--rule-line);
}

.section-heading.is-now {
  color: var(--accent);
}

.section-heading.is-waiting {
  color: var(--waiting);
}

.section-heading.is-inbox {
  color: var(--inbox);
}

.section-count {
  font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  font-size: 10.5px;
  opacity: 0.75;
}

.todo-row {
  position: relative;
  border-bottom: 1px solid var(--rule-line);
  transition: background 0.15s ease;
}

.todo-row:hover {
  background: var(--paper-hover);
}

.todo-row.is-fresh {
  animation: inkArrive 1.4s ease;
}

@keyframes inkArrive {
  0% {
    background: var(--paper-flash);
  }
  100% {
    background: transparent;
  }
}

.todo-line {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 4px;
}

/* Hand-drawn-feel paper checkbox */
.check-btn {
  margin-top: 2px;
  width: 17px;
  height: 17px;
  padding: 0;
  flex-shrink: 0;
  border: 1.5px solid var(--ink-secondary);
  border-radius: 3px;
  background: transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
}

.check-btn:hover {
  border-color: var(--ink-primary);
}

.check-btn:active {
  transform: scale(0.92);
}

.todo-row.is-high .check-btn {
  border-color: var(--accent);
}

.todo-row.is-done .check-btn {
  border-color: var(--ink-muted);
  background: var(--paper-elevated);
  color: var(--ink-muted);
}

.todo-body {
  flex: 1;
  min-width: 0;
  cursor: pointer;
}

.todo-title-row {
  display: flex;
  align-items: baseline;
  gap: 7px;
  flex-wrap: wrap;
}

.priority-mark {
  color: var(--accent);
  font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  font-weight: 700;
  font-size: 12.5px;
}

.todo-title {
  color: var(--ink-primary);
  word-break: break-word;
}

.todo-row.is-done .todo-title {
  color: var(--ink-muted);
  text-decoration: line-through;
  text-decoration-thickness: 1.2px;
}

.todo-row.is-waiting .todo-title {
  color: var(--ink-secondary);
}

.todo-notes {
  margin-top: 2px;
  font-size: 12.2px;
  color: var(--ink-secondary);
  word-break: break-word;
}

.todo-row.is-done .todo-notes {
  color: var(--ink-muted);
}

.todo-meta {
  margin-top: 4px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
  font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  font-size: 11px;
  color: var(--ink-muted);
}

.meta-person {
  color: var(--ink-secondary);
}

.meta-due {
  color: var(--ink-secondary);
}

.meta-source {
  padding: 0 4px;
  border-radius: 2px;
  border: 1px solid var(--rule-line);
  font-size: 10px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.meta-source.is-teams {
  color: var(--inbox);
  border-color: var(--inbox-soft);
}

.meta-source.is-outlook {
  color: var(--waiting);
  border-color: var(--waiting-soft);
}

.meta-link {
  border: none;
  background: transparent;
  padding: 0;
  font: inherit;
  color: var(--inbox);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}

.meta-id {
  opacity: 0;
  transition: opacity 0.15s ease;
}

.todo-row:hover .meta-id {
  opacity: 0.7;
}

/* Row quick actions (hidden until hover to keep paper calm) */
.row-actions {
  display: flex;
  align-items: center;
  gap: 2px;
  opacity: 0;
  transition: opacity 0.14s ease;
  flex-shrink: 0;
}

.todo-row:hover .row-actions,
.todo-row:focus-within .row-actions,
.todo-row.is-editing .row-actions,
.todo-row.is-inbox .row-actions {
  opacity: 1;
}

.act-btn {
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-muted);
  border-radius: 3px;
  padding: 2px 6px;
  font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.12s ease;
}

.act-btn:hover {
  color: var(--ink-primary);
  background: var(--paper-elevated);
  border-color: var(--rule-line);
}

.act-btn.is-active {
  color: var(--accent);
}

.act-btn.is-accept {
  color: var(--ink-primary);
  border-color: var(--rule-strong);
}

.act-btn.is-danger:hover {
  color: var(--accent);
  border-color: var(--accent-soft);
  background: var(--accent-soft);
}

/* Inline paper editor drawer */
.editor-drawer {
  padding: 10px 10px 12px 27px;
  background: var(--paper-elevated);
  border-top: 1px dashed var(--rule-line);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.editor-input,
.editor-textarea {
  width: 100%;
  border: 1px solid var(--rule-strong);
  border-radius: 4px;
  background: var(--paper-bg);
  color: var(--ink-primary);
  font-family: inherit;
  font-size: 13px;
  padding: 6px 8px;
  outline: none;
}

.editor-textarea {
  min-height: 54px;
  resize: vertical;
  font-size: 12.5px;
}

.editor-input:focus,
.editor-textarea:focus {
  border-color: var(--ink-primary);
}

.editor-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
}

.editor-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 2px;
}

.btn-ghost,
.btn-ink {
  border-radius: 4px;
  padding: 4px 11px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn-ghost {
  border: 1px solid var(--rule-strong);
  background: transparent;
  color: var(--ink-secondary);
}

.btn-ghost:hover {
  color: var(--ink-primary);
  background: var(--paper-hover);
}

.btn-ink {
  border: 1px solid var(--ink-primary);
  background: var(--ink-primary);
  color: var(--paper-bg);
}

.btn-ink:hover {
  opacity: 0.9;
}

/* Empty State */
.empty-state {
  padding: 48px 16px;
  text-align: center;
  color: var(--ink-muted);
}

.empty-title {
  font-family: 'Iowan Old Style', 'Palatino Linotype', 'Songti SC', 'Noto Serif SC', Georgia, serif;
  font-size: 16px;
  color: var(--ink-secondary);
  margin: 0 0 6px;
}

.empty-desc {
  margin: 0 auto 16px;
  max-width: 340px;
  font-size: 12.5px;
  line-height: 1.6;
}

/* Footer */
.sheet-footer {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--rule-line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  font-size: 11px;
  color: var(--ink-muted);
}

.text-btn {
  border: none;
  background: transparent;
  color: var(--ink-secondary);
  font: inherit;
  cursor: pointer;
  padding: 2px 4px;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.text-btn:hover {
  color: var(--accent);
}

/* Toast */
.toast {
  position: fixed;
  right: 22px;
  bottom: 20px;
  z-index: 20;
  background: var(--ink-primary);
  color: var(--paper-bg);
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 4px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
}

@media (max-width: 520px) {
  .desk {
    padding: 8px;
  }
  .sheet {
    padding: 16px 14px 16px 28px;
    min-height: 340px;
  }
  .margin-rule {
    left: 18px;
  }
  .row-actions {
    opacity: 1;
  }
}

    </style>
  </head>
  <body>
    <div id="desk" class="desk">
      <main class="sheet" aria-label="Paper Todo">
        <div class="margin-rule" aria-hidden="true"></div>

        <header class="masthead">
          <div class="masthead-left">
            <div class="date-stamp" id="date-stamp"></div>
            <h1 class="sheet-title">Paper Todo</h1>
          </div>
          <div class="masthead-right">
            <span class="sync-indicator" id="sync-indicator" title="Live sync">
              <span class="sync-dot"></span>
              <span class="sync-label" id="sync-label">Synced</span>
            </span>
            <button
              type="button"
              class="icon-btn"
              id="theme-toggle"
              title="Toggle light / dark paper"
              aria-label="Toggle light or dark paper"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
              </svg>
            </button>
          </div>
        </header>

        <nav class="filter-bar" aria-label="Filter tasks by status">
          <div class="tabs" id="status-tabs" role="tablist">
            <button type="button" class="tab is-active" data-tab="active" role="tab">
              Active <span class="tab-count" data-count="active">0</span>
            </button>
            <button type="button" class="tab" data-tab="now" role="tab">
              Focus <span class="tab-count" data-count="now">0</span>
            </button>
            <button type="button" class="tab" data-tab="inbox" role="tab">
              Inbox <span class="tab-count" data-count="inbox">0</span>
            </button>
            <button type="button" class="tab" data-tab="waiting" role="tab">
              Waiting <span class="tab-count" data-count="waiting">0</span>
            </button>
            <button type="button" class="tab" data-tab="done" role="tab">
              Done <span class="tab-count" data-count="done">0</span>
            </button>
          </div>
          <div class="people-bar" id="people-bar" hidden></div>
        </nav>

        <form class="composer" id="composer" autocomplete="off">
          <div class="composer-main">
            <span class="composer-glyph" aria-hidden="true">+</span>
            <input
              id="composer-input"
              class="composer-input"
              type="text"
              placeholder="Write a task… (@person  !urgent  ~waiting  *focus)"
              aria-label="Add a new task"
            />
            <button type="submit" class="composer-submit" id="composer-submit">Add</button>
          </div>
          <div class="composer-extras" id="composer-extras" hidden>
            <label class="mini-field">
              <span>Status</span>
              <select id="composer-status">
                <option value="todo">Todo</option>
                <option value="now">Focus</option>
                <option value="waiting">Waiting</option>
                <option value="inbox">Inbox</option>
              </select>
            </label>
            <label class="mini-field">
              <span>Person</span>
              <input id="composer-person" type="text" placeholder="e.g. Alex" />
            </label>
            <label class="mini-field">
              <span>Due</span>
              <input id="composer-due" type="text" placeholder="e.g. Today 5pm" />
            </label>
            <button type="button" class="mini-toggle" id="composer-priority" data-active="false" title="Mark urgent">
              ! Urgent
            </button>
          </div>
        </form>

        <section class="list-area" id="list-area" aria-live="polite"></section>

        <footer class="sheet-footer" id="sheet-footer">
          <div class="footer-stats" id="footer-stats"></div>
          <div class="footer-actions">
            <button type="button" class="text-btn" id="clear-done-btn" hidden>Clear done</button>
          </div>
        </footer>

        <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
      </main>
    </div>
